{% extends "base_auth.html" %}
{% block title %}Login - Campus Voice{% endblock %}
{% block content %}
<div class="cv-card p-5 animate-scale-in">
  <form method="post" class="space-y-3">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <input type="{% if field.name == 'password' %}password{% else %}text{% endif %}" name="{{ field.name }}" id="{{ field.id_for_label }}" placeholder="{{ field.label }}" class="cv-input" {% if field.help_text %}aria-describedby="{{ field.id_for_label }}-help"{% endif %}>
        {% if field.errors %}
          {% for error in field.errors %}
            <p class="mt-1 text-[13px] text-red-600">{{ error }}</p>
          {% endfor %}
        {% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="btn-fb btn-primary-fb w-full text-lg py-3 cursor-pointer">Log In</button>
  </form>
  <hr class="cv-divider my-5">
  <div class="text-center">
    <a href="{% url 'accounts:register' %}" class="btn-fb btn-success-fb text-base px-6 py-3">Create New Account</a>
  </div>
</div>
{% endblock %}
