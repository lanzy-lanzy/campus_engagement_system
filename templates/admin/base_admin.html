{% load static %}
<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PulseCampus Admin Panel">
  <title>{% block title %}Admin - PulseCampus{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@unpoly/headroom@2"></script>
  <script src="https://unpkg.com/unpoly@3"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.15)',
            'card': '0 4px 20px -2px rgba(0, 0, 0, 0.08)',
            'card-hover': '0 12px 32px -4px rgba(0, 0, 0, 0.12)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    [x-cloak] { display: none !important; }
    .glassmorphism {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .dark .glassmorphism {
      background: rgba(17, 24, 39, 0.85);
    }
    .sidebar-link {
      position: relative;
      transition: all 0.2s ease-out;
    }
    .sidebar-link::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      background: linear-gradient(90deg, #4f46e5, #818cf8);
      border-radius: 0 4px 4px 0;
      transition: width 0.2s ease-out;
    }
    .sidebar-link:hover::before,
    .sidebar-link.active::before {
      width: 4px;
      height: 60%;
    }
    .sidebar-link.active {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.1), rgba(129, 140, 248, 0.05));
      color: #4f46e5;
    }
    .sidebar-link.active .icon-bg {
      background: linear-gradient(135deg, #4f46e5, #818cf8);
      color: white;
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stagger-1 { animation-delay: 0.05s; }
    .stagger-2 { animation-delay: 0.1s; }
    .stagger-3 { animation-delay: 0.15s; }
    .stagger-4 { animation-delay: 0.2s; }
    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body x-data="adminLayout()" class="bg-slate-50 dark:bg-gray-900 text-slate-800 dark:text-gray-200 min-h-screen font-sans" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <div class="flex h-screen overflow-hidden">
    {% include "admin/sidebar.html" %}
    
    <div class="flex-1 flex flex-col overflow-hidden">
      {% include "admin/topbar.html" %}
      
      <main class="flex-1 overflow-y-auto p-6 scrollbar-thin" up-main>
        <div class="max-w-7xl mx-auto">
          {% block admin_content %}{% endblock %}
        </div>
      </main>
    </div>
  </div>

  <div id="admin-modal-root"></div>

  <script>
    function adminLayout() {
      return {
        sidebarOpen: false,
        darkMode: localStorage.getItem('admin-dark-mode') === 'true',
        
        init() {
          if (this.darkMode) {
            document.documentElement.classList.add('dark');
          }
        },
        
        toggleDarkMode() {
          this.darkMode = !this.darkMode;
          localStorage.setItem('admin-dark-mode', this.darkMode);
          if (this.darkMode) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        },
        
        toggleSidebar() {
          this.sidebarOpen = !this.sidebarOpen;
        }
      }
    }

    up.on('up:render', function(event, params) {
      const content = event.target.querySelector('[up-main]');
      if (content) {
        content.classList.add('animate-fade-in');
      }
    });
  </script>
</body>
</html>
