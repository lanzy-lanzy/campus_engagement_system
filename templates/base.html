{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PulseCampus - Turn student voices into campus action.">
  <title>{% block title %}PulseCampus{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="bg-[#f0f2f5] text-[#1c1e21] min-h-screen font-['Inter',system-ui,sans-serif]" x-data="{ mobileMenu: false, profileMenu: false }" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% include "partials/topnav.html" %}
  <main class="pt-[56px] min-h-[calc(100vh-56px)]">
    <div class="{% block main_container_class %}cv-page-narrow{% endblock %} mx-auto px-4 py-5">
      {% block top_messages %}{% include "partials/messages.html" %}{% endblock %}
      {% block content %}{% endblock %}
    </div>
  </main>
  <div id="create-post-modal-root"></div>
  <script src="{% static 'js/app.js' %}"></script>
  <script>
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        if (typeof initMentions === 'function') initMentions();
      });
    } else {
      if (typeof initMentions === 'function') initMentions();
    }
  </script>
  <script>
    document.addEventListener('htmx:configRequest', function(evt) {
      const csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
      if (csrfInput) {
        evt.detail.headers['X-CSRFToken'] = csrfInput.value;
      }
    });
  </script>
</body>
</html>
