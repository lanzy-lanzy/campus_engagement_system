{% with person=active_person %}
<header class="cv-chat-header">
  <div class="cv-chat-avatar">{{ person.username|first|upper }}</div>
  <div class="min-w-0">
    <h2>{{ person.get_full_name|default:person.username }}</h2>
    <p>{{ person.department|default:"Campus member" }}</p>
  </div>
</header>
{% endwith %}
