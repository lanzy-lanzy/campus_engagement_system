{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<header class="mb-6">
  <h1 class="text-2xl font-semibold text-[#2C3E94]">Admin Dashboard</h1>
  <p class="text-sm text-slate-500">Campus engagement overview.</p>
</header>
<div class="grid gap-4 sm:grid-cols-3">
  <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
    <div class="text-sm text-slate-500">Total Posts</div>
    <div class="text-3xl font-bold text-[#2C3E94]">{{ posts_count|default:0 }}</div>
  </div>
  <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
    <div class="text-sm text-slate-500">Total Users</div>
    <div class="text-3xl font-bold text-[#2C3E94]">{{ users_count|default:0 }}</div>
  </div>
  <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
    <div class="text-sm text-slate-500">Open Reports</div>
    <div class="text-3xl font-bold text-[#2C3E94]">{{ reports_count|default:0 }}</div>
  </div>
</div>
{% endblock %}
