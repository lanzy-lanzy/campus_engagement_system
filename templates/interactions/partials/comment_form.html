<form method="post" action="{% url 'interactions:add_comment' post.pk %}{% if in_modal %}?modal=1{% endif %}" hx-post="{% url 'interactions:add_comment' post.pk %}{% if in_modal %}?modal=1{% endif %}" hx-target="#{% if in_modal %}modal-comments{% else %}comments{% endif %}-{{ post.pk }}" hx-swap="outerHTML" class="mt-3 flex items-center gap-2">
  {% csrf_token %}
  <input type="hidden" name="parent" value="">
  <div class="flex-1 relative" x-data="mentionComposer('')" x-init="init($refs.editor, $refs.body)">
    <input type="hidden" name="body" x-ref="body" value="">
    <div
      x-ref="editor"
      data-mention-editor
      contenteditable="true"
      role="textbox"
      aria-label="Write a comment"
      data-placeholder="Write a comment... Use @username to mention"
      class="cv-mention-editor cv-comment-mention-editor"
      @input="onInput"
      @keydown="onKeydown"
      @blur="onBlur"></div>
    <div x-show="open" x-cloak class="mention-dropdown mention-dropdown-up">
      <template x-for="(friend, index) in friends" :key="friend.id">
        <button type="button" class="mention-item w-full text-left" :class="{ 'is-active': index === activeIndex }" @mousedown.prevent="selectFriend(index)">
          <span class="mention-item-avatar">
            <template x-if="friend.avatar_url"><img :src="friend.avatar_url" alt=""></template>
            <template x-if="!friend.avatar_url"><span x-text="initialFor(friend)"></span></template>
          </span>
          <span class="min-w-0">
            <span class="mention-item-name" x-text="friend.display_name || friend.username"></span>
            <span class="mention-item-meta" x-text="friend.department || ('@' + friend.username)"></span>
          </span>
        </button>
      </template>
    </div>
  </div>
  <button type="submit" class="w-9 h-9 rounded-full bg-[#1877f2] flex items-center justify-center text-white hover:bg-[#166fe5] transition cursor-pointer flex-shrink-0">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
  </button>
</form>
