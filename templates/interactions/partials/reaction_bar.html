{% load interaction_tags %}
{% with user_reaction=post|user_reaction:user %}
<div id="{% if in_modal %}modal-reactions-{{ post.pk }}{% else %}reactions-{{ post.pk }}{% endif %}"
     class="space-y-1"
     data-current-reaction="{{ user_reaction|default:'' }}"
     {% if force_oob %}hx-swap-oob="outerHTML"{% endif %}
     {% if not in_modal %}
     hx-get="{% url 'interactions:get_reaction_bar' post.pk %}"
     hx-trigger="every 30s"
     hx-swap="outerHTML"
     {% endif %}>
  <div class="flex items-center">
    <div class="relative flex-1"
         x-data="{ showPicker: false, holdTimer: null, hideTimer: null, wasLongPress: false }"
         @mouseenter="clearTimeout(hideTimer)"
         @mouseleave="clearTimeout(holdTimer); hideTimer = setTimeout(() => { showPicker = false; wasLongPress = false; }, 220)">
      <button
        type="button"
        class="cv-react-btn w-full {% if user_reaction %}active{% endif %}"
        aria-pressed="{% if user_reaction %}true{% else %}false{% endif %}"
        @mousedown="wasLongPress = false; holdTimer = setTimeout(() => { showPicker = true; wasLongPress = true; }, 400)"
        @mouseup="clearTimeout(holdTimer)"
        @touchstart="wasLongPress = false; holdTimer = setTimeout(() => { showPicker = true; wasLongPress = true; }, 400)"
        @touchend="clearTimeout(holdTimer)"
        @click="if (!wasLongPress && !showPicker) { htmx.ajax('POST', '{% url 'interactions:toggle_reaction' post.pk user_reaction|default:'like' %}{% if in_modal %}?modal=1{% endif %}', {target: '#{% if in_modal %}modal-reactions{% else %}reactions{% endif %}-{{ post.pk }}', swap: 'outerHTML', source: $el}) }"
        @mouseenter="clearTimeout(hideTimer); holdTimer = setTimeout(() => { showPicker = true; }, 250)">
        {% if user_reaction %}
          <span class="cv-reaction-glyph" aria-hidden="true">{{ user_reaction|reaction_icon }}</span>
          <span class="capitalize">{{ user_reaction }}</span>
        {% else %}
          <span class="cv-like-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M8.75 10.5v9h-4.5v-9h4.5Zm1.5 8.75V10.1l3.42-5.32c.24-.37.65-.58 1.09-.58.78 0 1.39.68 1.3 1.45l-.47 4.1h3.16c1.25 0 2.2 1.12 1.99 2.35l-.86 5.08a2.5 2.5 0 0 1-2.47 2.08h-7.16Z"></path>
            </svg>
          </span>
          <span>Like</span>
        {% endif %}
      </button>
      <div
        x-show="showPicker"
        x-transition
        class="cv-picker absolute bottom-full left-0"
        @mouseenter="clearTimeout(hideTimer)"
        @mouseleave="hideTimer = setTimeout(() => { showPicker = false; wasLongPress = false; }, 220)"
        x-cloak>
        <button type="button" class="reaction-btn" title="Like" aria-label="Like" hx-post="{% url 'interactions:toggle_reaction' post.pk 'like' %}{% if in_modal %}?modal=1{% endif %}" hx-target="#{% if in_modal %}modal-reactions{% else %}reactions{% endif %}-{{ post.pk }}" hx-swap="outerHTML" @click.stop="showPicker = false">{{ "like"|reaction_icon }}</button>
        <button type="button" class="reaction-btn" title="Love" aria-label="Love" hx-post="{% url 'interactions:toggle_reaction' post.pk 'love' %}{% if in_modal %}?modal=1{% endif %}" hx-target="#{% if in_modal %}modal-reactions{% else %}reactions{% endif %}-{{ post.pk }}" hx-swap="outerHTML" @click.stop="showPicker = false">{{ "love"|reaction_icon }}</button>
        <button type="button" class="reaction-btn" title="Wow" aria-label="Wow" hx-post="{% url 'interactions:toggle_reaction' post.pk 'wow' %}{% if in_modal %}?modal=1{% endif %}" hx-target="#{% if in_modal %}modal-reactions{% else %}reactions{% endif %}-{{ post.pk }}" hx-swap="outerHTML" @click.stop="showPicker = false">{{ "wow"|reaction_icon }}</button>
        <button type="button" class="reaction-btn" title="Sad" aria-label="Sad" hx-post="{% url 'interactions:toggle_reaction' post.pk 'sad' %}{% if in_modal %}?modal=1{% endif %}" hx-target="#{% if in_modal %}modal-reactions{% else %}reactions{% endif %}-{{ post.pk }}" hx-swap="outerHTML" @click.stop="showPicker = false">{{ "sad"|reaction_icon }}</button>
        <button type="button" class="reaction-btn" title="Angry" aria-label="Angry" hx-post="{% url 'interactions:toggle_reaction' post.pk 'angry' %}{% if in_modal %}?modal=1{% endif %}" hx-target="#{% if in_modal %}modal-reactions{% else %}reactions{% endif %}-{{ post.pk }}" hx-swap="outerHTML" @click.stop="showPicker = false">{{ "angry"|reaction_icon }}</button>
        <button type="button" class="reaction-btn" title="Haha" aria-label="Haha" hx-post="{% url 'interactions:toggle_reaction' post.pk 'haha' %}{% if in_modal %}?modal=1{% endif %}" hx-target="#{% if in_modal %}modal-reactions{% else %}reactions{% endif %}-{{ post.pk }}" hx-swap="outerHTML" @click.stop="showPicker = false">{{ "haha"|reaction_icon }}</button>
      </div>
    </div>
    <div class="flex-1">
      <button type="button" class="cv-react-btn w-full" hx-get="{% url 'posts:modal' post.pk %}" hx-target="#post-modal-root" hx-swap="innerHTML">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h8m-8 4h5m8-4c0 4.418-4.03 8-9 8a9.86 9.86 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
        <span>Comment</span>
      </button>
    </div>
    <div class="flex-1">
      <button type="button" class="cv-react-btn w-full" hx-get="{% url 'posts:share' post.pk %}" hx-target="#share-{{ post.pk }}" hx-swap="outerHTML">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12s-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-9.316l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 12.632a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684z"></path></svg>
        <span>Share</span>
      </button>
    </div>
  </div>
</div>
{% endwith %}
