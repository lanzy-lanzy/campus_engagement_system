{% extends "base.html" %}
{% block title %}Messages - Campus Voice{% endblock %}
{% block content %}
<div class="grid h-[calc(100vh-8rem)] gap-6 lg:grid-cols-[320px_1fr]" id="messages-container">
  <div class="rounded-2xl border border-slate-200 bg-white shadow-lg overflow-hidden flex flex-col">
    <div class="p-4 border-b border-slate-200 bg-gradient-to-r from-[#2C3E94] to-[#5DADE2]">
      <h2 class="text-lg font-semibold text-white">Messages</h2>
      <div class="mt-3 relative">
        <input type="text" id="friend-search" placeholder="Search friends..." class="w-full rounded-lg bg-white/90 border-0 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-white/50" hx-get="{% url 'messages:get_friends' %}" hx-trigger="keyup changed delay:300ms" hx-target="#friends-list">
        <svg class="w-5 h-5 absolute right-3 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
    </div>
    <div id="friends-list" class="flex-1 overflow-y-auto">
      {% for conv in conversations %}
        <button class="w-full p-4 text-left border-b border-slate-100 hover:bg-sky-50 transition flex items-center gap-3" hx-get="{% url 'messages:conversation' conv.pk %}" hx-target="#conversation-area" hx-swap="innerHTML">
          <div class="w-10 h-10 rounded-full bg-gradient-to-r from-[#2C3E94] to-[#5DADE2] flex items-center justify-center text-white font-medium">
            {{ conv.get_other_participant:request.user.username|first|upper }}
          </div>
          <div class="flex-1 min-w-0">
            <div class="font-medium text-slate-900 truncate">{{ conv.get_other_participant:request.user.get_full_name|default:conv.get_other_participant:request.user.username }}</div>
            <div class="text-xs text-slate-500 truncate">{{ conv.updated_at|timesince }} ago</div>
          </div>
        </button>
      {% empty %}
        <div class="p-8 text-center text-slate-500">No conversations yet. Search for a friend to start messaging!</div>
      {% endfor %}
    </div>
  </div>

  <div id="conversation-area" class="rounded-2xl border border-slate-200 bg-white shadow-lg overflow-hidden flex flex-col">
    <div class="flex-1 flex items-center justify-center text-slate-400">
      <div class="text-center">
        <svg class="w-16 h-16 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        <p>Select a conversation to start messaging</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
