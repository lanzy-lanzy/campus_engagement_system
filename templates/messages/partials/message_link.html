<a class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:bg-gradient-to-r hover:from-sky-50 hover:to-blue-50 hover:text-[#2C3E94] transition" href="{% url 'messages:inbox' %}">
  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
  Messages
  {% with request.user.conversations.all as convs %}
    {% with convs|length as count %}
      {% if count > 0 %}<span class="ml-auto bg-[#2C3E94] text-white text-xs rounded-full px-2 py-0.5">{{ count }}</span>{% endif %}
    {% endwith %}
  {% endwith %}
</a>
