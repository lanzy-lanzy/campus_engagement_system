{% if messages %}
<div class="space-y-2 mb-4 animate-fade-in">
  {% for message in messages %}
    <div x-data="{ show: true }" x-show="show" x-transition class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium {% if message.tags == 'success' %}bg-[#d4edda] text-[#155724] border border-[#c3e6cb]{% elif message.tags == 'error' %}bg-[#f8d7da] text-[#721c24] border border-[#f5c6cb]{% elif message.tags == 'warning' %}bg-[#fff3cd] text-[#856404] border border-[#ffeeba]{% else %}bg-[#cce5ff] text-[#004085] border border-[#b8daff]{% endif %}">
      {% if message.tags == 'success' %}
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      {% elif message.tags == 'error' %}
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      {% else %}
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      {% endif %}
      <span class="flex-1">{{ message }}</span>
      <button @click="show = false" class="ml-auto p-1 rounded hover:bg-black/5 transition cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
  {% endfor %}
</div>
{% endif %}
