<button type="button" class="fixed left-4 top-4 z-40 rounded-xl bg-gradient-to-r from-[#2C3E94] to-[#3d5285] px-4 py-2.5 text-sm font-semibold text-white shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-200 lg:hidden" @click="sidebarOpen = true" aria-label="Open menu">
  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
</button>
<aside class="fixed inset-y-0 left-0 z-50 w-72 -translate-x-full bg-white/95 backdrop-blur-xl px-6 py-8 shadow-2xl transition-all duration-300 ease-in-out lg:static lg:w-auto lg:translate-x-0 lg:shadow-none lg:bg-transparent lg:backdrop-blur-none" :class="{ 'translate-x-0': sidebarOpen }">
  <div class="flex items-center justify-between mb-10">
    <a href="{% url 'posts:feed' %}" class="group flex items-center gap-2">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#2C3E94] to-[#5DADE2] flex items-center justify-center shadow-lg group-hover:shadow-xl transition-shadow">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
      </div>
      <span class="text-xl font-bold font-display bg-gradient-to-r from-[#2C3E94] to-[#5DADE2] bg-clip-text text-transparent">PulseCampus</span>
    </a>
    <button class="rounded-lg p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition lg:hidden" type="button" @click="sidebarOpen = false" aria-label="Close menu">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
  </div>
  {% if user.is_authenticated %}
    <nav class="space-y-1">
      <a class="nav-item flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:text-[#2C3E94] transition-all cursor-pointer" href="{% url 'posts:feed' %}">
        <span class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-500 group-hover:bg-[#2C3E94]/10 group-hover:text-[#2C3E94] transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v12a2 2 0 01-2 2z"></path></svg>
        </span>
        Feed
      </a>
      <a class="nav-item flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:text-[#2C3E94] transition-all cursor-pointer" href="{% url 'posts:create' %}">
        <span class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-[#2C3E94]/10 hover:text-[#2C3E94] transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </span>
        Create Post
      </a>
      <a class="nav-item flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:text-[#2C3E94] transition-all cursor-pointer" href="{% url 'accounts:profile' %}">
        <span class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-[#2C3E94]/10 hover:text-[#2C3E94] transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </span>
        Profile
      </a>
      {% if user.is_campus_admin %}
        <div class="my-4 border-t border-slate-200/60"></div>
        <p class="px-4 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Admin</p>
        <a class="nav-item flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:text-[#2C3E94] transition-all cursor-pointer" href="{% url 'dashboard:index' %}">
          <span class="w-8 h-8 rounded-lg bg-purple-50 flex items-center justify-center text-purple-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
          </span>
          Dashboard
        </a>
        <a class="nav-item flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:text-[#2C3E94] transition-all cursor-pointer" href="{% url 'dashboard:users' %}">
          <span class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-blue-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          </span>
          Users
        </a>
        <a class="nav-item flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:text-[#2C3E94] transition-all cursor-pointer" href="{% url 'dashboard:posts' %}">
          <span class="w-8 h-8 rounded-lg bg-green-50 flex items-center justify-center text-green-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v12a2 2 0 01-2 2z"></path></svg>
          </span>
          Content
        </a>
        <a class="nav-item flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:text-[#2C3E94] transition-all cursor-pointer" href="{% url 'dashboard:analytics' %}">
          <span class="w-8 h-8 rounded-lg bg-yellow-50 flex items-center justify-center text-yellow-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
          </span>
          Analytics
        </a>
        <a class="nav-item flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:text-[#2C3E94] transition-all cursor-pointer" href="{% url 'dashboard:settings' %}">
          <span class="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          </span>
          Settings
        </a>
        <a class="nav-item flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:text-[#2C3E94] transition-all cursor-pointer" href="{% url 'dashboard:moderation' %}">
          <span class="w-8 h-8 rounded-lg bg-red-50 flex items-center justify-center text-red-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
          </span>
          Moderation
        </a>
      {% endif %}
    </nav>
    <div class="absolute bottom-6 left-6 right-6">
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button class="flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-600 hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-all cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
          Logout
        </button>
      </form>
    </div>
  {% else %}
    <nav class="space-y-2">
      <a class="nav-item flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:text-[#2C3E94] transition-all cursor-pointer" href="{% url 'accounts:login' %}">
        <span class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-[#2C3E94]/10 hover:text-[#2C3E94] transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
        </span>
        Login
      </a>
      <a class="nav-item flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-700 hover:text-[#2C3E94] transition-all cursor-pointer" href="{% url 'accounts:register' %}">
        <span class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-[#2C3E94]/10 hover:text-[#2C3E94] transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
        </span>
        Register
      </a>
    </nav>
  {% endif %}
</aside>
