<div class="fixed inset-0 z-[200] flex items-start justify-center overflow-y-auto bg-black/75 px-3 py-7 sm:px-4" data-create-post-modal-backdrop>
  <div class="w-full max-w-[630px] overflow-hidden rounded-lg bg-white shadow-2xl" id="create-post-modal" role="dialog" aria-modal="true" aria-labelledby="create-post-modal-title">
    <header class="sticky top-0 z-10 flex min-h-14 items-center justify-center border-b border-[#3a3b3c] bg-[#242526] px-14 text-[#e4e6eb]">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        <h2 id="create-post-modal-title" class="truncate text-[18px] font-extrabold">Create Post</h2>
      </div>
      <button type="button" class="absolute right-3 flex h-9 w-9 items-center justify-center rounded-full border-0 bg-[#3a3b3c] text-[#e4e6eb] hover:bg-[#4e4f50]" aria-label="Close" onclick="document.getElementById('create-post-modal-root').innerHTML = ''">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </header>
    <div class="max-h-[calc(100vh-84px)] overflow-y-auto bg-white">
      <form method="post" enctype="multipart/form-data" hx-post="{% url 'posts:create' %}" hx-target="#post-list" hx-swap="beforebegin" hx-on::after-request="if (event.detail.successful) { document.getElementById('create-post-modal-root').innerHTML = '' }">
        {% csrf_token %}
        <div class="p-4 space-y-4">
          <div class="flex items-center gap-3">
            {% if user.avatar %}
              <img src="{{ user.avatar.url }}" class="cv-avatar" alt="">
            {% else %}
              <div class="cv-avatar-placeholder bg-gradient-to-br from-[#1877f2] to-[#42b72a]">{{ user.get_full_name|default:user.username|first|upper }}</div>
            {% endif %}
            <span class="font-semibold text-[15px] text-[#050505]">{{ user.get_full_name|default:user.username }}</span>
          </div>

          <div>
            <input type="text" name="title" class="w-full text-[15px] font-semibold placeholder-[#65676b] border-0 focus:ring-0 p-0" placeholder="Post title..." data-mentions>
          </div>

          <div>
            <textarea name="description" rows="4" class="w-full resize-none border-0 text-[15px] placeholder-[#65676b] focus:ring-0 p-0" placeholder="Share the details... Use @username to mention friends"></textarea>
          </div>

          <div>
            <input type="text" name="tags" class="cv-input" placeholder="Tags (e.g. safety, library-hours, campus-life)">
          </div>

          <div>
            <select name="category" class="cv-select w-full">
              {% for value, label in form.category.field.choices %}
                <option value="{{ value }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="grid gap-3 sm:grid-cols-2">
            <div>
              <label for="modal_images" class="block text-[13px] font-semibold text-[#606770] mb-1.5 uppercase tracking-wide">Images</label>
              <input type="file" name="images" id="modal_images" accept="image/*" multiple class="cv-file-input">
              <p class="mt-1 text-[12px] text-[#65676b]">Up to 5 images</p>
            </div>
            <div>
              <label for="modal_video" class="block text-[13px] font-semibold text-[#606770] mb-1.5 uppercase tracking-wide">Video</label>
              <input type="file" name="video" id="modal_video" accept="video/*" class="cv-file-input">
              <p class="mt-1 text-[12px] text-[#65676b]">1 optional video</p>
            </div>
          </div>
        </div>

        <hr class="cv-divider">
        <div class="flex items-center justify-end gap-3 p-4">
          <button type="submit" class="btn-fb btn-primary-fb cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            Post
          </button>
          <button type="button" class="btn-fb btn-secondary-fb cursor-pointer" onclick="document.getElementById('create-post-modal-root').innerHTML = ''">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
