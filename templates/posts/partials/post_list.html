{% for post in posts %}
  {% include "posts/partials/post_card.html" %}
  {% if forloop.last and page_obj.has_next %}
    <div hx-get="{% url 'posts:feed' %}?page={{ page_obj.next_page_number }}&sort={{ sort }}&q={{ query }}&category={{ category }}"
         hx-trigger="revealed"
         hx-swap="afterend"
         class="py-6 text-center">
      <div class="inline-block h-8 w-8 animate-spin rounded-full border-4 border-[#1877f2] border-r-transparent" role="status">
        <span class="sr-only">Loading...</span>
      </div>
    </div>
  {% endif %}
{% empty %}
  <div class="cv-card p-12 text-center animate-fade-in">
    <div class="w-16 h-16 rounded-full bg-[#f0f2f5] flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8 text-[#bec3c9]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v12a2 2 0 01-2 2z"></path></svg>
    </div>
    <p class="text-[17px] font-semibold text-[#1c1e21]">No posts to show yet</p>
    <p class="text-[15px] text-[#65676b] mt-1">Be the first to share an idea or concern!</p>
    <a href="{% url 'posts:create' %}" class="btn-fb btn-primary-fb mt-4 inline-flex">Create a post</a>
  </div>
{% endfor %}
